info:
  version: 1.0.0
  description: UPF configuration

configuration:
  # debugLevel: panic|fatal|error|warn|info|debug|trace
  debugLevel: info
  # ReportCaller: true|false
  ReportCaller: false

  pfcp:
    - addr: 127.0.0.8

  gtpu:
    - addr: 10.100.200.3
    # [optional] gtpu.name
    # - name: upf.5gc.nctu.me
    # [optional] gtpu.ifname
    # - ifname: gtpif

  # Dataplane port mapping (must match UPF-U upf_u.yaml ports)
  # NOTE: SGi follows CORE by convention (same physical port)
  dataplane_ports:
    access: 0
    core: 1
    sgi: 1

  # Optional direct-I/O worker ownership (one UE per worker, in list order).
  # Match each worker's ONVM service ID and UPF-U YAML; manager must reserve all VFs.
  # Requires an SMF that requests CH=1 and uses the returned Created PDR endpoint.
  # upf_u_workers:
  #   - {service_id: 14, n3_ip: 192.0.2.11, ul_teid: 0x1001, n3_port: 0, n6_port: 1}
  #   - {service_id: 15, n3_ip: 192.0.2.12, ul_teid: 0x1002, n3_port: 2, n6_port: 3}

  dnn_list:
    - dnn: internet
      cidr: 10.60.0.0/24
      # [optional] dnn_list[*].natifname
      # natifname: eth0
